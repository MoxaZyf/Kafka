broker.id=1
zookeeper.connect=zookeeper:2181

# Слушатели: INTERNAL (PLAINTEXT для Docker) + EXTERNAL (SSL для хоста)
listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
advertised.listeners=INTERNAL://kafka1:9092,EXTERNAL://localhost:9094
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:SSL
inter.broker.listener.name=INTERNAL
security.inter.broker.protocol=PLAINTEXT

# SSL настройки (только для EXTERNAL listener)
ssl.keystore.location=/etc/kafka/secrets/kafka.broker1.keystore.jks
ssl.keystore.password=password
ssl.key.password=password
ssl.truststore.location=/etc/kafka/secrets/kafka.truststore.jks
ssl.truststore.password=password
ssl.client.auth=none
ssl.endpoint.identification.algorithm=HTTPS

# ACL Authorizer (ОБЯЗАТЕЛЬНО)
authorizer.class.name=kafka.security.authorizer.AclAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:CN=localhost,OU=kafka,O=test,L=city,ST=state,C=RU
